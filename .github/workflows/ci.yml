name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        go: ["1.20.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o phpvm.exe ./cmd/phpvm
      - run: .\phpvm.exe version

  build-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go test ./...
        env:
          GOARCH: "386"
      - run: go build -o phpvm-386.exe ./cmd/phpvm
        env:
          GOARCH: "386"

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go test -race ./...

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
      - name: Install latest public release
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "phpvm-public"
          $env:PHPVM_ROOT = Join-Path $env:RUNNER_TEMP "phpvm-data"
          New-Item -ItemType Directory -Force (Join-Path $env:PHPVM_ROOT "bin") | Out-Null
          Set-Content (Join-Path $env:PHPVM_ROOT "bin\phpvm.exe") "legacy"
          .\install.ps1 -InstallDir $destination -NoPathUpdate
          if (Test-Path (Join-Path $env:PHPVM_ROOT "bin\phpvm.exe")) { throw "Legacy executable was not migrated" }
          if (-not (Test-Path (Join-Path $env:PHPVM_ROOT "bin\phpvm.exe.legacy"))) { throw "Legacy backup was not preserved" }
          & (Join-Path $destination "phpvm.exe") version
