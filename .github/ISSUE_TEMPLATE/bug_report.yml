name: Bug report
description: Report a reproducible problem in phpvm
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Run `phpvm doctor --json` and remove any sensitive paths before attaching its output.
  - type: input
    id: version
    attributes:
      label: phpvm version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 24H2, x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
    validations:
      required: true

